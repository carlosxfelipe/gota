<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gotaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#003B99" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#gotaGradient)" stroke-width="1.5" opacity="0.3"/>
  <!-- Water Drop (Gota) Shape -->
  <path d="M 50 14 C 50 14 26 50 26 66 C 26 79.25 36.75 90 50 90 C 63.25 90 74 79.25 74 66 C 74 50 50 14 50 14 Z" 
        fill="url(#gotaGradient)" 
        filter="url(#glow)"/>
  <!-- Inner Highlight Reflection -->
  <path d="M 40 40 C 35 48 34 58 35 66 C 36 74 41 80 47 82 C 43 80 39 74 38 66 C 37 58 39 48 43 42 Z" 
        fill="#FFFFFF" 
        opacity="0.45"/>
  <!-- Center Small Bubble / Particle -->
  <circle cx="58" cy="62" r="4" fill="#FFFFFF" opacity="0.5"/>
</svg>
